version: 1

# 存量模块先标记为 legacy；新模块或完成迁移的模块设置 managed: true。
modules:
  - id: rpc
    roots: [packages/rpc/src]
    managed: false
  - id: shared
    roots: [packages/shared/src]
    managed: false
  # source-server：SourceServer/R3 的纯 domain 契约（profile/更新授权/兼容/发布描述符/错误分类）。
  - id: source-server
    roots: [packages/shared/src/source-server]
    managed: true
    requires: [shared]
    publicEntrypoints:
      [packages/shared/src/source-server/index.ts, packages/shared/src/source-server/contract.ts]
    layers:
      domain: "."
    owner: remote
  # sqlite-migrations：SQLite 升级基础设施，Node-only 公开子路径。
  - id: sqlite-migrations
    roots: [packages/shared/src/sqlite-migrations]
    managed: true
    requires: []
    publicEntrypoints:
      [
        packages/shared/src/sqlite-migrations/index.ts,
        packages/shared/src/sqlite-migrations/contract.ts,
      ]
    layers:
      adapters: "."
    owner: persistence
  - id: provider
    roots: [packages/provider/src]
    managed: false
  - id: provider-node
    roots: [packages/provider-node/src]
    managed: false
  - id: services
    roots: [packages/services/src]
    managed: false
  - id: session
    roots: [packages/services/src/session]
    managed: false
    requires: [shared]
    publicEntrypoints: [packages/services/src/session/contract.ts]
    owner: conversation
  # bot-topic-resource：话题资源接纳归档（唯一 owner）+ 授权/下载。只读当前任务已接纳快照，
  # 字节只经 Host 反向 RPC 回 CLI，不落用户路径、不新建 bot 登录。
  - id: bot-topic-resource
    roots:
      [
        packages/services/src/bots/topic-resource,
        packages/services/src/bots/topicArchive.ts,
        packages/services/src/bots/topicResource.ts,
      ]
    managed: true
    requires: [shared, services]
    publicEntrypoints:
      [
        packages/services/src/bots/topicResource.ts,
        packages/services/src/bots/topicArchive.ts,
        packages/services/src/bots/topic-resource/contract.ts,
      ]
    layers:
      adapters: "."
    owner: bots
  - id: storage
    roots: [packages/services/src/storage]
    managed: true
    requires: [shared, rpc, services]
    publicEntrypoints: [packages/services/src/storage/contract.ts]
    layers: { domain: domain, app: app, adapters: adapters }
    layerOrder: [domain, app, adapters]
    owner: desktop-settings
  # project-storage：Host 项目组织态（迁移 + 唯一写仓储），启动 composition 注入。
  # domain=契约/remote policy/saved workspace 序列化；app=迁移编排/Migration SQL/身份工具；adapters=SQLite 仓储与 composition。
  - id: project-storage
    roots: [packages/services/src/project-storage]
    managed: true
    requires: [shared, sqlite-migrations]
    publicEntrypoints:
      [
        packages/services/src/project-storage/index.ts,
        packages/services/src/project-storage/contract.ts,
      ]
    layers: { domain: domain, app: app, adapters: "." }
    layerOrder: [domain, app, adapters]
    owner: conversation
  # task-facts：CLI 会话事实摄入/命令交接应用层；存储与 CLI 来源均通过端口注入。
  - id: task-facts
    roots: [packages/services/src/task-facts]
    managed: true
    requires: [shared]
    publicEntrypoints:
      [packages/services/src/task-facts/index.ts, packages/services/src/task-facts/contract.ts]
    layers: { domain: domain, app: app }
    layerOrder: [domain, app]
    owner: conversation
  # project：Host 项目公开应用服务（唯一写者是 project-storage 仓储）。
  - id: project
    roots: [packages/services/src/project]
    managed: true
    requires: [project-storage, services, shared]
    publicEntrypoints:
      [
        packages/services/src/project/index.ts,
        packages/services/src/project/contract.ts,
        packages/services/src/project/app/autoArchiveScheduler.ts,
      ]
    layers: { domain: domain, app: app, adapters: adapters }
    layerOrder: [domain, app, adapters]
    owner: conversation
  # app-control：App 控制十二意图在 Host 侧的服务 owner（项目/会话授权、观察、取消），
  # 只绑定可信连接与根会话；导航提交仍由桌面 app-control-navigation 适配器完成。
  - id: app-control
    roots: [packages/services/src/app-control]
    managed: true
    requires: [session-control, services, shared, project]
    publicEntrypoints:
      - packages/services/src/app-control/index.ts
      - packages/services/src/app-control/contract.ts
    layers:
      contract: contract.ts
      app: "."
    layerOrder: [contract, app]
    owner: conversation
  # managed-worktree-tasks：受管 worktree 的唯一服务 owner；只操作有所有权元数据的
  # 受管目录，删除前复用项目仓储/任务/共享引用/终端与删除租约。
  - id: managed-worktree-tasks
    roots: [packages/services/src/managed-worktree-tasks]
    managed: true
    requires: [shared, services, project-storage]
    publicEntrypoints:
      - packages/services/src/managed-worktree-tasks/index.ts
      - packages/services/src/managed-worktree-tasks/contract.ts
    layers:
      app: "."
    owner: conversation
  # remote-projects：本机远端项目入口 intent 的唯一 owner；连接/在线事实仍归
  # windowRemoteConnectionRegistry，catalog 只做只读组合，删除仅清本机 membership/cache。
  - id: remote-projects
    roots: [packages/services/src/remote-projects]
    managed: true
    requires: [shared, services, project, project-storage]
    publicEntrypoints:
      - packages/services/src/remote-projects/index.ts
      - packages/services/src/remote-projects/contract.ts
    layers:
      app: "."
    owner: conversation
  - id: client
    roots: [packages/client/src]
    managed: false
  - id: server
    roots: [packages/server/src]
    managed: false
  - id: zcode-server-cli
    roots: [packages/zcode-server-cli/src]
    managed: false
  - id: ui
    roots: [packages/ui/src]
    managed: false
  - id: web
    roots: [packages/web/src]
    managed: false
  - id: desktop
    roots: [packages/desktop/src]
    managed: false
  # file-open-apps：本机文件系统关联枚举/启动（Desktop main adapters）。
  # 唯一事实源是系统关联；模块只接受本机真实文件，目录/远端身份/错误路径失败关闭。
  - id: file-open-apps
    roots:
      - packages/desktop/src/main/file-open-apps
    managed: true
    requires: [shared]
    publicEntrypoints:
      - packages/desktop/src/main/file-open-apps/index.ts
      - packages/desktop/src/main/file-open-apps/contract.ts
    layers:
      adapters: "."
    owner: desktop
  # app-control-navigation：App 控制十二意图的桌面导航传输适配器（Host bridge → Main
  # 窗口 surface → preload IPC → renderer Root 动作）。项目/任务授权仍归 services 的
  # AppControlService；本模块只关联请求、可信窗口、generation、取消与回执。
  - id: app-control-navigation
    roots:
      - packages/desktop/src/app-control-navigation
    managed: true
    requires: [shared, services, desktop]
    publicEntrypoints:
      - packages/desktop/src/app-control-navigation/contract.ts
      - packages/desktop/src/app-control-navigation/index.ts
      - packages/desktop/src/app-control-navigation/host.ts
      - packages/desktop/src/app-control-navigation/main.ts
      - packages/desktop/src/app-control-navigation/renderer.ts
    layers:
      adapters: "."
    owner: desktop
  - id: formal-proof
    roots: [packages/formal-proof/src]
    managed: false
  - id: zcode-cua
    roots: [packages/zcode-cua]
    managed: false
  - id: relay
    roots: [packages/relay/src]
    managed: false
  - id: zcode-cli
    roots: [apps/zcode-cli]
    managed: false

  # topic-resource-tool：ReadTopicResource 的 schema/reader/handler；只在 Host 注入
  # topicResourcePort（本任务有 bot 接纳事实）时注册，不伪造本地下载。
  - id: topic-resource-tool
    roots:
      [
        apps/zcode-cli/packages/core/src/tool/topic-resource,
        apps/zcode-cli/packages/core/src/tool/handlers/read-topic-resource.ts,
      ]
    managed: true
    requires: [zcode-cli]
    publicEntrypoints:
      [
        apps/zcode-cli/packages/core/src/tool/handlers/read-topic-resource.ts,
        apps/zcode-cli/packages/core/src/tool/topic-resource/contract.ts,
      ]
    layers:
      app: "."
    owner: cli

  # office-runtime：四个文档插件共用的 MCP/面板运行时。domain=锚点/文本/模型，
  # app=DocumentOwner（唯一视图状态所有者），adapters=文件/解析/导入/MCP server，
  # ui=面板。产物由 scripts/build.mjs 打进各插件 dist/，运行时不加载 node_modules。
  - id: office-runtime
    roots: [apps/zcode-cli/packages/office-runtime]
    managed: true
    requires: []
    publicEntrypoints:
      [
        apps/zcode-cli/packages/office-runtime/index.ts,
        apps/zcode-cli/packages/office-runtime/contract.ts,
      ]
    layers: { domain: src/domain, app: src/app, adapters: src/adapters, ui: ui }
    layerOrder: [domain, app, adapters, ui]
    owner: plugin

  - id: gen-ui-protocol
    roots: [packages/shared/src/gen-ui]
    managed: true
    requires: []
    publicEntrypoints: [packages/shared/src/gen-ui/index.ts, packages/shared/src/gen-ui/contract.ts]
    layers: { domain: "." }
    owner: conversation
  - id: gen-ui-service
    roots: [packages/services/src/gen-ui]
    managed: true
    requires: [services, shared, rpc, gen-ui-protocol, mcp-apps-protocol]
    publicEntrypoints:
      [
        packages/services/src/gen-ui/index.ts,
        packages/services/src/gen-ui/contract.ts,
        packages/services/src/gen-ui/node.ts,
      ]
    layers: { domain: domain, app: app, adapters: adapters }
    layerOrder: [domain, app, adapters]
    owner: conversation

  - id: gen-ui
    roots: [packages/ui/src/gen-ui]
    managed: true
    requires: [ui, services, gen-ui-service, gen-ui-protocol, mcp-apps-protocol, plugin-ui]
    publicEntrypoints:
      [
        packages/ui/src/gen-ui/index.ts,
        packages/ui/src/gen-ui/contract.ts,
        packages/ui/src/gen-ui/host.ts,
      ]
    layers: { domain: domain, app: app, adapters: adapters, ui: components }
    layerOrder: [domain, app, adapters, ui]
    owner: conversation

  # 插件 UI（MCP Apps 沙箱）：模块边界见各模块 CONTRACT.md。
  - id: mcp-apps-protocol
    roots: [packages/shared/src/mcp-apps]
    managed: true
    requires: []
    publicEntrypoints:
      [
        packages/shared/src/mcp-apps/index.ts,
        packages/shared/src/mcp-apps/contract.ts,
        packages/shared/src/mcp-apps/hostContract.ts,
      ]
    layers:
      domain: "."
    owner: plugin
  - id: mcp-ui
    roots: [apps/zcode-cli/packages/bootstrap/src/zcode-protocol/mcp-ui]
    managed: true
    requires: [zcode-cli, shared, mcp-apps-protocol]
    publicEntrypoints:
      [
        apps/zcode-cli/packages/bootstrap/src/zcode-protocol/mcp-ui/index.ts,
        apps/zcode-cli/packages/bootstrap/src/zcode-protocol/mcp-ui/contract.ts,
      ]
    layers:
      app: "."
    owner: plugin
  - id: plugin-ui-bridge
    roots: [packages/services/src/plugin-ui-bridge]
    managed: true
    requires: [services, shared, mcp-apps-protocol]
    publicEntrypoints:
      [
        packages/services/src/plugin-ui-bridge/index.ts,
        packages/services/src/plugin-ui-bridge/contract.ts,
        packages/services/src/plugin-ui-bridge/appToolsContract.ts,
        packages/services/src/plugin-ui-bridge/samplingContract.ts,
      ]
    layers:
      app: "."
    owner: plugin
  - id: plugin-sandbox
    roots:
      - packages/desktop/src/main/pluginSandbox
      - packages/desktop/src/host/pluginSandbox
      - packages/desktop/src/preload/pluginSandbox
      - packages/desktop/src/renderer/src/plugin-sandbox
    managed: true
    requires: [desktop, shared, mcp-apps-protocol, gen-ui-protocol]
    publicEntrypoints: [
        packages/desktop/src/host/pluginSandbox/index.ts,
        packages/desktop/src/host/pluginSandbox/contract.ts,
        packages/desktop/src/preload/pluginSandbox/hostBridge.ts,
        packages/desktop/src/main/pluginSandbox/index.ts,
        packages/desktop/src/main/pluginSandbox/contract.ts,
        # 页面兼容接口由宿主及其契约测试维护。
        packages/desktop/src/renderer/src/plugin-sandbox/aliasRuntime.ts,
        packages/desktop/src/renderer/src/plugin-sandbox/aliasApi.ts,
      ]
    layers:
      adapters: "."
    owner: plugin
  - id: plugin-ui
    roots: [packages/ui/src/plugin-ui]
    managed: true
    requires: [ui, shared, mcp-apps-protocol, plugin-ui-bridge, plugin-sandbox]
    publicEntrypoints:
      [
        packages/ui/src/plugin-ui/index.ts,
        packages/ui/src/plugin-ui/contract.ts,
        packages/ui/src/plugin-ui/hostPrimitives.ts,
      ]
    layers:
      domain: domain
      app: app
      adapters: adapters
      ui: components
    layerOrder: [domain, app, adapters, ui]
    owner: plugin

  # extension-host-protocol：扩展清单/能力/授权/槽位/线协议纯 domain 契约。
  - id: extension-host-protocol
    roots: [packages/shared/src/extension-host]
    managed: true
    # sessions 能力表直接复用 session-control 的 canonical App 端口 schema（E8）。
    requires: [shared, session-control]
    publicEntrypoints:
      [
        packages/shared/src/extension-host/index.ts,
        packages/shared/src/extension-host/contract.ts,
        packages/shared/src/extension-host/adapters/sdk.ts,
      ]
    layers: { domain: ".", adapters: adapters }
    layerOrder: [domain, adapters]
    owner: plugin

  # extension-host-service：窗口本地 Host 的授权记录/能力网关/槽位投影/loopback 唯一 owner；
  # 扩展进程生命周期由 Desktop Main supervisor 持有。
  - id: extension-host-service
    roots: [packages/services/src/extensions]
    managed: true
    # 会话能力以客户端类调用方调 AppControlService.bindClient（E8）；不新增第二 session owner。
    requires: [services, shared, rpc, extension-host-protocol, app-control, session-control]
    publicEntrypoints:
      [
        packages/services/src/extensions/index.ts,
        packages/services/src/extensions/contract.ts,
        packages/services/src/extensions/node.ts,
      ]
    layers: { app: app, adapters: adapters }
    layerOrder: [app, adapters]
    owner: plugin

  # extension-slots：扩展槽位投影，只消费 services/extensions 的快照；手机/Web 不渲染。
  - id: extension-slots
    roots: [packages/ui/src/extensions]
    managed: true
    requires: [ui, services, shared, extension-host-protocol, extension-host-service]
    publicEntrypoints: [packages/ui/src/extensions/index.ts, packages/ui/src/extensions/contract.ts]
    layers:
      domain: domain
      adapters: adapters
      ui: components
    layerOrder: [domain, adapters, ui]
    owner: plugin

  # remote-input-prediction：手机远控输入预测（ghost hint）的 v4 线格式与只读查询契约。
  # 草稿仍归 composer；预测不写 transcript/accepted，不启动第二 runtime。
  - id: remote-input-prediction
    roots: [packages/shared/src/zcode-protocol-v4/input-prediction]
    managed: true
    requires: [shared, zcode-cli]
    publicEntrypoints:
      [
        packages/shared/src/zcode-protocol-v4/input-prediction/contract.ts,
        packages/services/src/zcode-agent/inputPredictionSwitch.ts,
        apps/zcode-cli/packages/bootstrap/src/zcode-protocol/input-prediction-handler.ts,
        apps/zcode-cli/packages/core/src/runtime/methods/input-prediction-sidecar.ts,
      ]
    layers: { domain: "." }
    owner: conversation

  # settings-search：设置页搜索与定位（纯索引/匹配 + 一个结果面板），只依赖 ui 层。
  - id: settings-search
    roots: [packages/ui/src/settings-search]
    managed: true
    requires: [ui]
    publicEntrypoints:
      [packages/ui/src/settings-search/index.ts, packages/ui/src/settings-search/contract.ts]
    layers:
      ui: "."
    owner: settings

  # ui-file-menu：文件另存为/打开方式菜单的共享 UI 原子；不持有文件读取 owner。
  - id: ui-file-menu
    roots: [packages/ui/src/file-menu]
    managed: true
    requires: [shared, ui]
    publicEntrypoints: [packages/ui/src/file-menu/index.ts, packages/ui/src/file-menu/contract.ts]
    layers:
      ui: "."
    owner: files

  # session-control：CLI 会话控制命令的共享契约与测试夹具（C5 新建 workspace 包）。
  # publicEntrypoints 与 package.json exports（contracts/cli/app/testing）保持一致。
  - id: session-control
    roots: [packages/session-control/src]
    managed: true
    requires: []
    publicEntrypoints:
      - packages/session-control/src/contract.ts
      - packages/session-control/src/application/cli/index.ts
      - packages/session-control/src/application/app/index.ts
      - packages/session-control/src/testing/index.ts
    layers:
      contract: contract
      domain: domain
      app: application
    layerOrder: [contract, domain, app]
    owner: cli

  # plugin-api：面向插件作者的类型入口（private workspace 包，不发布 npm）。
  # 运行时不加载，只重导出 extension-host 的公开契约与 SDK。
  - id: plugin-api
    roots: [packages/plugin-api/src]
    managed: true
    requires: [shared, extension-host-protocol]
    publicEntrypoints:
      - packages/plugin-api/src/index.ts
      - packages/plugin-api/src/manifest.ts
      - packages/plugin-api/src/contract.ts
    layers:
      contract: contract.ts
      adapters: "."
    layerOrder: [contract, adapters]
    owner: plugin

  # data-sync：设置页数据同步页与同步弹窗；状态 owner 是弹窗 hook，只在桌面本机设置页开放。
  - id: data-sync
    roots: [packages/ui/src/data-sync]
    managed: true
    requires: [services, shared, ui]
    publicEntrypoints: [packages/ui/src/data-sync/index.ts, packages/ui/src/data-sync/contract.ts]
    layers:
      contract: contract
      domain: domain
      app: app
      ui: ui
    layerOrder: [contract, domain, app, ui]
    owner: settings

  # settings-scope：设置页 Scope 菜单按设备分组的唯一状态 owner（插件/MCP/技能/命令/子智能体/钩子共用）。
  # 本机「用户」用 base services，远端「用户」只经该设备 source-settings attachment；
  # 离线设备与跨设备目标 fail-closed，Web/手机不提供远端「用户」。
  - id: settings-scope
    roots: [packages/ui/src/settings-scope]
    managed: true
    requires: [services, shared, ui]
    publicEntrypoints:
      - packages/ui/src/settings-scope/index.ts
      - packages/ui/src/settings-scope/contract.ts
    layers:
      contract: contract
      domain: domain
      app: app
      ui: ui
    layerOrder: [contract, domain, app, ui]
    owner: settings

  # project-sidebar：Host readTree 的项目行/任务行投影与本地项目编辑器；
  # 外壳仍持 footer/automations/plugin store/文件树/分屏与 legacy workspace 行。
  - id: project-sidebar
    roots: [packages/ui/src/project-sidebar]
    managed: true
    requires: [services, shared, ui]
    publicEntrypoints:
      [packages/ui/src/project-sidebar/index.ts, packages/ui/src/project-sidebar/contract.ts]
    layers:
      ui: "."
    owner: conversation
  # Side Pane 完整视图（docs/specs/side-pane-full-view.md）：浮窗外壳与状态派生，
  # 只通过 contract/index 暴露给 shell 与面板。
  - id: side-pane-full-view
    roots: [packages/ui/src/side-pane-full-view]
    managed: true
    requires: [shared, ui]
    publicEntrypoints:
      [
        packages/ui/src/side-pane-full-view/index.ts,
        packages/ui/src/side-pane-full-view/contract.ts,
      ]
    layers:
      ui: "."
    owner: conversation

global:
  maxFileLines: 400
  maxContractLines: 300
  maxPublicMethods: 12
  forbidCycles: true
  forbidDeepImports: true
  managedOnly: true

exceptions:
  - id: gen-ui-tweak-runtime-size
    rule: max-file-lines
    paths: [packages/desktop/src/renderer/src/plugin-sandbox/genUiTweakRuntime.js]
    reason: Keep parameter binding and registration lifecycle together; runtime-manifest.json and tests verify file integrity.
  - id: gen-ui-tweak-runtime-lint
    rule: disable-count
    paths: [packages/desktop/src/renderer/src/plugin-sandbox/genUiTweakRuntime.js]
    reason: Allow the control-character validation regex and the single-file parameter-control runtime.
