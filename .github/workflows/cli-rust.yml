name: CLI Rust CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cli-rust-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

env:
  HUSKY: "0"

jobs:
  rust:
    name: Rust
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          persist-credentials: false
      # Rust 构建不需要 node_modules，但命令走 pnpm script（单一事实来源），
      # 所以要 pnpm 与 node 而跳过依赖安装。install-pnpm 必须显式为 true：
      # setup-workspace 原本把「装 pnpm」与「装依赖」绑在同一个开关上。
      - uses: ./.github/actions/setup-workspace
        with:
          install-dependencies: "false"
          install-pnpm: "true"
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Cargo build
        run: pnpm build:zcode-cli-rust
      # 边界检查必须在 fmt/clippy 之前：违规的依赖方向会让后续检查的输出难以归因。
      - name: Crate boundaries
        run: node scripts/check-zcode-cli-rust-boundaries.mjs
      - name: Cargo fmt
        run: cargo fmt --manifest-path apps/zcode-cli-rust/Cargo.toml --all --check
      - name: Cargo clippy
        run: cargo clippy --locked --manifest-path apps/zcode-cli-rust/Cargo.toml --workspace --all-targets -- -D warnings
      - name: Cargo test
        run: pnpm test:zcode-cli-rust

  # Schema、contract assets 与 domain fixtures 的 --check 均从当前 TS 契约生成；不检测 Rust DTO 全面漂移，也不替代 Node interop。
  protocol-schema:
    name: Protocol schema and oracle fixtures
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-workspace
      - name: Build Node oracle dependencies
        run: pnpm build:zcode-cli-rust-oracle-deps
      - name: Protocol contract drift
        run: pnpm check:zcode-cli-rust-protocol-schema
      - name: Contract asset drift
        run: pnpm check:zcode-cli-rust-contract-assets
      - name: Domain fixture drift
        run: pnpm check:zcode-cli-rust-domain-fixtures
      - name: Driver tests
        run: pnpm test:zcode-cli-rust-drivers

  linux-node-interop:
    name: Linux Node/Rust interop
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-workspace
      - uses: dtolnay/rust-toolchain@stable
      - name: Build Node oracle dependencies
        run: pnpm build:zcode-cli-rust-oracle-deps
      - name: Build Node CLI
        run: pnpm --dir apps/zcode-cli/packages/cli build
      - name: Build Rust CLI and Node reader
        run: cargo build --locked --manifest-path apps/zcode-cli-rust/Cargo.toml --bin zcode-cli-rust --example node_read
      - name: Run real Node/Rust interop
        run: pnpm test:zcode-cli-rust-interop

  native-platform-check:
    name: Native compile (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-workspace
        with:
          install-dependencies: "false"
          install-pnpm: "true"
      - uses: dtolnay/rust-toolchain@stable
      - name: Native Rust compile check
        run: cargo check --locked --workspace --all-targets --manifest-path apps/zcode-cli-rust/Cargo.toml
